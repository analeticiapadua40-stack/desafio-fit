<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body style="margin:0">
<title>Diário Fit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============ TOKENS (claro / escuro) ============ */
:root{
 --bg:#e8ede1;--paper:#fffef8;--ink:#14241b;--edge:#14241b;--sh:#14241b;--mut:#58695e;--grid:#d5dccf;
 --sage:#a9c4a4;--sage-d:#6a9567;--forest:#1d4836;--on-forest:#f2ebd5;--beige:#ebe0c5;--gray:#d9dcd4;
 --ok:#2d8f58;--mid:#e5a823;--bad:#d4493e;
 --t-n:#d9dcd4;--t-g:#8fcf9f;--t-y:#f1d06a;--t-r:#e8928a;
 --f-head:'Chakra Petch','Arial Narrow',system-ui,sans-serif;--f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0d1410;--paper:#17211b;--ink:#ecf2ea;--edge:#58745f;--sh:#000;--mut:#93a499;--grid:#25342b;
 --sage:#4d6b4f;--sage-d:#86b284;--forest:#10281d;--on-forest:#efe8d2;--beige:#2b2a20;--gray:#26302a;
 --ok:#5fcf8a;--mid:#e9b84a;--bad:#ff8479;--t-n:#26302a;--t-g:#2c6a42;--t-y:#7d6a1f;--t-r:#7e332d;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0d1410;--paper:#17211b;--ink:#ecf2ea;--edge:#58745f;--sh:#000;--mut:#93a499;--grid:#25342b;
 --sage:#4d6b4f;--sage-d:#86b284;--forest:#10281d;--on-forest:#efe8d2;--beige:#2b2a20;--gray:#26302a;
 --ok:#5fcf8a;--mid:#e9b84a;--bad:#ff8479;--t-n:#26302a;--t-g:#2c6a42;--t-y:#7d6a1f;--t-r:#7e332d;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start}
/* ============ BLOCOS ============ */
.blk{background:var(--paper);border:2px solid var(--edge);border-radius:4px;box-shadow:5px 5px 0 var(--sh);padding:16px}
.blk h2,.blk h3,h1{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.05em;margin:0}
.blk>h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.blk>h2::before{content:"";width:12px;height:12px;background:var(--sage-d);border:2px solid var(--edge);flex:none}
.blk.sage{background:var(--sage)}.blk.beige{background:var(--beige)}
.lbl{font:600 10.5px var(--f-head);text-transform:uppercase;letter-spacing:.12em;color:var(--mut)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gA{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.sp{height:18px}
/* ============ MENU LATERAL ============ */
.side{position:sticky;top:22px;background:var(--forest);color:var(--on-forest);border:2px solid var(--edge);box-shadow:5px 5px 0 var(--sh);border-radius:4px;padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.brand{font:700 22px/1 var(--f-head);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px 12px;border-bottom:2px solid color-mix(in srgb,var(--on-forest) 30%,transparent);margin-bottom:6px}
.brand small{display:block;font:500 10px var(--f-head);letter-spacing:.18em;opacity:.7;margin-top:6px}
.nav{display:flex;flex-direction:column;gap:5px}
.navb{display:flex;align-items:center;gap:10px;background:transparent;border:2px solid transparent;color:inherit;padding:9px 10px;border-radius:3px;text-align:left;font:600 13px var(--f-head);text-transform:uppercase;letter-spacing:.06em}
.navb:hover{border-color:color-mix(in srgb,var(--on-forest) 50%,transparent)}
.navb[aria-current=page]{background:var(--beige);color:#14241b;border-color:var(--edge)}
.ico{display:inline-flex;flex:none}
.mini{margin-top:12px;padding:10px;background:color-mix(in srgb,#000 22%,transparent);border-radius:3px}
.mini b{font:700 26px/1 var(--f-head)}
.mini small{display:block;opacity:.75;font-size:11px;margin-top:2px}
.saved{font-size:11px;opacity:.7;margin-top:10px;padding-left:4px}
/* ============ TOPO ============ */
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:30px;line-height:1.05}
.top .sub{color:var(--mut);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;font:700 10.5px var(--f-head);text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border:2px solid var(--edge);background:var(--beige);color:#14241b;border-radius:2px}
.tag.ok{background:var(--t-g);color:#14241b}.tag.y{background:var(--t-y);color:#14241b}.tag.r{background:var(--t-r);color:#14241b}.tag.n{background:var(--t-n);color:var(--ink)}
/* ============ CONTROLES ============ */
.btn{border:2px solid var(--edge);background:var(--paper);padding:7px 14px;font:700 12px var(--f-head);text-transform:uppercase;letter-spacing:.07em;border-radius:3px;box-shadow:3px 3px 0 var(--sh);transition:transform .08s,box-shadow .08s}
.btn:hover{background:var(--beige);color:#14241b}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--sh)}
.btn.pri{background:var(--forest);color:var(--on-forest)}.btn.pri:hover{background:var(--sage-d);color:#14241b}
.btn.bad{color:var(--bad)}.btn.sm{padding:4px 9px;font-size:11px;box-shadow:2px 2px 0 var(--sh)}
.btn.on{background:var(--sage-d);color:#14241b}
.btn:disabled{opacity:.4;cursor:default}
.in,select.in,textarea.in{width:100%;border:2px solid var(--edge);background:var(--paper);border-radius:3px;padding:7px 9px;min-width:0}
.in:focus,.btn:focus-visible,.navb:focus-visible,.ck:focus-visible,.cell:focus-visible{outline:3px solid var(--mid);outline-offset:1px}
textarea.in{min-height:64px;resize:vertical}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ck{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid var(--edge);background:var(--paper);border-radius:2px;flex:none;margin:0;cursor:pointer;display:grid;place-content:center}
.ck:checked{background:var(--forest)}
.ck:checked::after{content:"";width:6px;height:12px;border:solid var(--on-forest);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck.auto:checked{background:var(--ok)}
/* ============ NÚMEROS E BARRAS ============ */
.stat .v{font:700 34px/1.05 var(--f-head);margin:4px 0 2px;letter-spacing:.01em}
.stat .v small{font-size:15px;font-weight:600;color:var(--mut)}
.stat .s{font-size:12px;color:var(--mut)}
.bar{height:18px;border:2px solid var(--edge);background:var(--paper);position:relative;border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--sage-d);transition:width .35s}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 11px,var(--paper) 11px 13px)}
.bar.g i{background:var(--ok)}.bar.y i{background:var(--mid)}.bar.r i{background:var(--bad)}
.mrow{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;align-items:center;margin-bottom:10px}
.mrow .bar{margin:0}.mrow b{font:700 13px var(--f-head);text-transform:uppercase;letter-spacing:.05em}
.mrow .num{grid-column:1/-1;font-size:12px;color:var(--mut);margin-top:-2px}
/* ============ REFEIÇÕES / TREINO ============ */
.meal{display:grid;grid-template-columns:78px minmax(0,1fr);gap:0 14px;padding:14px 0;border-top:2px dashed var(--grid)}
.meal:first-of-type{border-top:0}
.time{font:700 22px var(--f-head);background:var(--beige);color:#14241b;border:2px solid var(--edge);text-align:center;padding:6px 0;align-self:start;border-radius:2px}
.meal h3,.wk h3{font-size:15px}
.ref{color:var(--mut);font-size:12.5px;margin:2px 0 8px}
.meal.done .time{background:var(--t-g)}.meal.skip .time{background:var(--t-r)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.ex{display:grid;grid-template-columns:28px minmax(0,1fr) 96px 130px;gap:8px;align-items:center;padding:8px 0;border-top:2px dashed var(--grid)}
.ex.done .nm{text-decoration:line-through;color:var(--mut)}
.ex .nm b{font-size:14px}.ex .nm small{display:block;color:var(--mut)}
.exh{display:grid;grid-template-columns:28px minmax(0,1fr) 96px 130px;gap:8px}
.wkstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wd{border:2px solid var(--edge);background:var(--paper);padding:8px 4px;text-align:center;border-radius:3px;box-shadow:3px 3px 0 var(--sh)}
.wd b{display:block;font:700 12px var(--f-head);text-transform:uppercase}
.wd span{display:block;font-size:11px;color:var(--mut)}
.wd em{display:block;font:700 11px var(--f-head);font-style:normal;margin-top:3px}
.wd.sel{outline:3px solid var(--mid)}
.wd.n{background:var(--paper)}.wd.d{background:var(--t-g);color:#14241b}.wd.p{background:var(--t-y);color:#14241b}.wd.s{background:var(--t-r);color:#14241b}
.wd.d span,.wd.p span,.wd.s span{color:#14241b}
/* ============ ÁGUA ============ */
.glass{width:100%;max-width:150px;height:200px;border:3px solid var(--edge);background:var(--paper);position:relative;margin:0 auto;border-radius:2px 2px 10px 10px;overflow:hidden}
.glass i{position:absolute;left:0;right:0;bottom:0;background:var(--sage);border-top:3px solid var(--edge);transition:height .4s}
.glass b{position:absolute;inset:0;display:grid;place-items:center;font:700 34px var(--f-head);z-index:1}
/* ============ CALENDÁRIO ============ */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .hd{font:700 11px var(--f-head);text-transform:uppercase;letter-spacing:.08em;text-align:center;color:var(--mut)}
.cell{aspect-ratio:1.15/1;min-height:44px;border:2px solid var(--edge);border-radius:3px;background:var(--t-n);color:#14241b;padding:4px 6px;text-align:left;font:700 14px var(--f-head);display:flex;flex-direction:column;justify-content:space-between;box-shadow:2px 2px 0 var(--sh)}
.cell small{font:600 10px var(--f-body);opacity:.8}
.cell.g{background:var(--t-g)}.cell.y{background:var(--t-y)}.cell.r{background:var(--t-r)}
.cell.out{visibility:hidden}
.cell.sel{outline:3px solid var(--mid);outline-offset:1px}
.cell.today{box-shadow:inset 0 0 0 3px var(--forest),2px 2px 0 var(--sh)}
.cell.n{color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:14px;height:14px;border:2px solid var(--edge);vertical-align:-3px;margin-right:5px}
/* ============ CHECKLIST ============ */
.chk{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:2px dashed var(--grid)}
.chk:first-child{border-top:0}
.chk.na{opacity:.6}.chk label{flex:1;cursor:pointer}
.chk small{color:var(--mut);display:block;font-size:11.5px}
.pct{font:700 40px/1 var(--f-head)}
.tw{overflow-x:auto;border:2px solid var(--edge);border-radius:3px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:8px 10px;border-bottom:2px solid var(--grid);text-align:left;font-size:13px}
th{font:700 11px var(--f-head);text-transform:uppercase;letter-spacing:.08em;background:var(--beige);color:#14241b}
.chartbox{position:relative;height:250px}
.chartbox .none{height:100%;display:grid;place-items:center;text-align:center;color:var(--mut);border:2px dashed var(--grid);padding:12px}
.note{font-size:12px;color:var(--mut)}
.est{margin-top:10px}
/* ============ RESPONSIVO ============ */
@media (max-width:1020px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
 body{padding-bottom:96px}
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;border-radius:0;border-width:3px 0 0;box-shadow:none;padding:6px max(6px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));flex-direction:row}
 .side .brand,.side .mini,.side .saved{display:none}
 .nav{flex-direction:row;width:100%;justify-content:space-between}
 .navb{flex-direction:column;gap:2px;font-size:9px;padding:6px 2px;flex:1;text-align:center;letter-spacing:.02em;min-width:0}
 .navb span.t{overflow:hidden;text-overflow:ellipsis;max-width:100%}
 h1{font-size:24px}
 .g2,.g3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
 .ex,.exh{grid-template-columns:28px minmax(0,1fr) 1fr 1fr}.exh{display:none}.ex .nm{grid-column:2/-1}.ex>:nth-child(3){grid-column:2}
 .meal{grid-template-columns:minmax(0,1fr)}.time{width:84px}
 .g4{grid-template-columns:minmax(0,1fr)}
 .stat .v{font-size:28px}
 .cell{min-height:40px;padding:3px 4px;font-size:12px}.cell small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app"></div>

<script>
/* =====================================================================
   DIÁRIO FIT — um único arquivo (HTML + CSS + JS)
   Organização do código:
     1. Armazenamento (Store)  → trocar por API/banco no futuro
     2. Dados fixos (refeições, treinos)
     3. Datas e cálculos (metas, checklist, semana)
     4. Interface (abas) e gráficos
   Nenhum dado fictício: tudo começa vazio e vem do que você registra.
   ===================================================================== */

/* ---------- 1. ARMAZENAMENTO ----------
   Para integrar um banco no futuro, troque apenas load() e save()
   (ex.: fetch('/api/dados')). O resto do app usa só o objeto S. */
const KEY='diario-fit-v1';
let storageOK=true;
const Store={
  load(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null}catch(e){storageOK=false;return null}},
  save(s){try{localStorage.setItem(KEY,JSON.stringify(s));return true}catch(e){storageOK=false;return false}}
};
const DEF_SET={pesoInicial:null,pesoMeta:null,kcalMin:1600,kcalMax:1650,prot:120,carb:160,gord:56,agua:2000,treinos:4,sono:7};
function normalize(x){const s=x&&typeof x==='object'?x:{};
  return{v:1,settings:{...DEF_SET,...(s.settings||{})},days:(s.days&&typeof s.days==='object')?s.days:{},body:Array.isArray(s.body)?s.body:[]}}
let S=normalize(Store.load());
const G=()=>S.settings;
let saveTimer=null,savedAt=null;
function persist(){clearTimeout(saveTimer);saveTimer=setTimeout(flush,250)}
function flush(){clearTimeout(saveTimer);if(Store.save(S))savedAt=new Date();const el=document.getElementById('saved');if(el)el.textContent=savedText()}
function savedText(){return storageOK?(savedAt?'Salvo automaticamente às '+savedAt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'Salvo automaticamente neste navegador'):'⚠ Este navegador não permite salvar. Exporte um backup.'}
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

/* ---------- 2. DADOS FIXOS ---------- */
const MEALS=[
 {id:'pre',t:'06:00',n:'Pré-treino',ref:'Banana e café · ou pão · ou iogurte',trainOnly:true},
 {id:'cafe',t:'08:30',n:'Café da manhã / Pós-treino',ref:'2 ovos · 2 fatias de pão integral · 1 fatia de queijo branco · 1 fruta · café'},
 {id:'lm',t:'10:30',n:'Lanche da manhã',ref:'Iogurte natural ou grego · granola'},
 {id:'alm',t:'12:30',n:'Almoço',ref:'100–120 g de arroz cozido · 80–100 g de feijão · 130–150 g de frango · 10–15 g de farofa · salada à vontade'},
 {id:'lt',t:'16:00',n:'Lanche da tarde',ref:'Tapioca pequena com frango · ou pão integral com ovo · ou iogurte proteico com fruta'},
 {id:'jan',t:'19:30',n:'Jantar',ref:'Cuscuz com frango e salada · ou wrap de frango · ou omelete com frango e batata · ou sanduíche integral de frango'},
 {id:'ceia',t:'21:30',n:'Ceia (opcional)',ref:'Iogurte · queijo branco · ou fruta',optional:true}];
const WK={
 SEG:{n:'Segunda',t:'Inferiores A + esteira',ex:[['Leg press','3x12'],['Cadeira extensora','3x12'],['Mesa flexora','3x12'],['Elevação pélvica','3x12'],['Abdutora','2x15']],cardio:{tipo:'esteira',nome:'Esteira inclinada',min:25}},
 TER:{n:'Terça',t:'Superiores A + bicicleta',ex:[['Puxada alta','3x12'],['Remada sentada','3x12'],['Supino máquina','3x12'],['Desenvolvimento de ombros','2x12'],['Tríceps','2x12'],['Bíceps','2x12']],cardio:{tipo:'bike',nome:'Bicicleta',min:30}},
 QUI:{n:'Quinta',t:'Inferiores B + esteira',ex:[['Agachamento guiado','3x12'],['Mesa flexora','3x12'],['Stiff','3x10'],['Elevação pélvica','3x12'],['Panturrilha','2x15']],cardio:{tipo:'esteira',nome:'Esteira',min:30}},
 SAB:{n:'Sábado',t:'Superiores B + bicicleta',ex:[['Remada unilateral','3x12'],['Puxada aberta','3x12'],['Crucifixo máquina','3x12'],['Elevação lateral','3x12'],['Bíceps','2x12'],['Prancha','3x20 a 30 s']],cardio:{tipo:'bike',nome:'Bicicleta',min:35}}};
const PLAN_BY_DOW={1:'SEG',2:'TER',4:'QUI',6:'SAB'};
const DOW_SHORT=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const CHK=[['prot','Cumpri minha meta de proteínas'],['kcal','Mantive minha alimentação dentro da meta calórica'],['meals','Fiz minhas refeições planejadas'],['agua','Bebi a meta de água do dia'],['fv','Consumi frutas e vegetais'],['treino','Realizei o treino planejado ou respeitei meu dia de descanso'],['sono','Dormi adequadamente']];
const NUTRI=['prot','kcal','meals','agua','fv'];
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const ICONS={home:'M3 11l9-8 9 8v10H15v-7H9v7H3z',food:'M6 3v7a3 3 0 0 0 3 3v8M12 3v7a3 3 0 0 1-3 3M9 3v7M18 3c-2.5 1.5-3.5 4-3.5 8H18v10',dumb:'M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12',drop:'M12 3s6.5 6.8 6.5 11.5a6.5 6.5 0 0 1-13 0C5.5 9.8 12 3 12 3z',trend:'M3 18l6-6 4 4 8-9M15 7h6v6',cal:'M4 6h16v15H4zM4 11h16M8 3v5M16 3v5',sliders:'M4 7h9M17 7h3M4 17h3M11 17h9M13 4v6M7 14v6'};

/* ---------- 3. DATAS E CÁLCULOS ---------- */
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c,12)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const TODAY=()=>iso(new Date());
const dow=s=>parse(s).getDay();
const weekStart=s=>addDays(s,-((dow(s)+6)%7));
const fd=s=>{const d=parse(s);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')};
const fdl=s=>{const t=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long'}).format(parse(s));return t[0].toUpperCase()+t.slice(1)};
const fn=(n,d=1)=>n==null?'—':new Intl.NumberFormat('pt-BR',{maximumFractionDigits:d}).format(n);
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const R=d=>S.days[d]||{};
const W=d=>S.days[d]||(S.days[d]={});
const getp=(o,p)=>p.reduce((a,k)=>a==null?a:a[k],o);
function setp(o,p,v){let a=o;for(let i=0;i<p.length-1;i++)a=a[p[i]]??={};a[p[p.length-1]]=v}

function planOf(d){const x=R(d);if(x.wk==='rest')return null;if(x.wk&&WK[x.wk])return x.wk;return PLAN_BY_DOW[dow(d)]||null}
function hasRecords(d){const x=S.days[d];if(!x)return false;
  if(x.meals&&Object.values(x.meals).some(m=>m.status||m.ate||m.qty||m.obs))return true;
  const m=x.macros;if(m&&['kcal','prot','carb','gord'].some(k=>m[k]!=null))return true;
  if(x.water>0||x.sleepH!=null||x.wb)return true;
  if(x.habits&&Object.values(x.habits).some(Boolean))return true;
  const w=x.wo;if(w&&(w.status||w.obs||(w.ex&&Object.values(w.ex).some(e=>e.done||e.carga||e.reps))||(w.cardio&&Object.values(w.cardio).some(v=>v!==''&&v!=null))))return true;
  if(x.extras&&x.extras.length)return true;
  if(x.ov&&Object.keys(x.ov).length)return true;

function checks(d){
  const x=R(d),m=x.macros||{},hb=x.habits||{},ov=x.ov||{},g=G(),res={};
  const put=(k,auto)=>{const o=ov[k];res[k]={val:o!=null?o:auto,ov:o!=null,auto}};
  put('prot',!!hb.proteina||(m.prot!=null&&m.prot>=g.prot*.95));
  put('kcal',m.kcal!=null&&m.kcal<=g.kcalMax*1.04&&m.kcal>=g.kcalMin*.85);
  put('meals',requiredMeals(d).every(q=>(x.meals||{})[q.id]&&x.meals[q.id].status==='done'));
  put('agua',(x.water||0)>=g.agua);
  put('fv',!!(hb.frutas&&hb.vegetais));
  if(planOf(d))put('treino',(x.wo||{}).status==='done');else res.treino={val:null,ov:false,rest:true};
  put('sono',!!hb.sono||(x.sleepH!=null&&x.sleepH>=g.sono));
  return res}

  const pc=days.map(d=>pctOf(d)).filter(v=>v!=null),np=days.map(d=>pctOf(d,NUTRI)).filter(v=>v!=null);

function pesoInfo(){
  const b=S.body.filter(e=>e.peso!=null).sort((a,c)=>a.date<c.date?-1:1);
  const last=b[b.length-1],first=b[0],g=G();
